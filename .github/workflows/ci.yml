name: CI

on:
  push:
    branches: [main, master, "feat/**", "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run web generator tests
        run: node tests/js/run.mjs

      - name: Run SaaS browser-crypto tests
        run: node tests/js/saas_crypto.mjs

      - name: Check the bundled web wordlist is in sync
        run: |
          python3 scripts/build_web_wordlist.py
          git diff --exit-code web/wordlist.js
